<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0D2640" />

  <!-- Motivo de nodos conectados, como textura ambiental -->
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.14">
    <line x1="760" y1="90" x2="980" y2="40" />
    <line x1="980" y1="40" x2="1140" y2="150" />
    <line x1="760" y1="90" x2="840" y2="260" />
    <line x1="980" y1="40" x2="1020" y2="230" />
    <line x1="1140" y1="150" x2="1020" y2="230" />
    <line x1="840" y1="260" x2="1020" y2="230" />
    <line x1="840" y1="260" x2="900" y2="440" />
    <line x1="1020" y1="230" x2="1120" y2="420" />
  </g>
  <g stroke="#E4AB37" stroke-width="2" opacity="0.55">
    <line x1="840" y1="260" x2="1020" y2="230" />
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="760" cy="90" r="6" /><circle cx="980" cy="40" r="5" />
    <circle cx="1140" cy="150" r="7" /><circle cx="1020" cy="230" r="6" />
    <circle cx="900" cy="440" r="5" /><circle cx="1120" cy="420" r="5" />
  </g>
  <circle cx="840" cy="260" r="9" fill="#00897B" />
  <circle cx="1020" cy="230" r="6" fill="#E4AB37" />

  <!-- Marca -->
  <g transform="translate(90,225)">
    <g fill="none" stroke="#F2F7F9" stroke-width="3" stroke-linecap="round">
      <line x1="34" y1="0" x2="6" y2="48" />
      <line x1="34" y1="0" x2="62" y2="48" />
      <line x1="6" y1="48" x2="62" y2="48" stroke="#E4AB37" />
    </g>
    <circle cx="34" cy="0" r="8" fill="#F2F7F9" />
    <circle cx="6" cy="48" r="8" fill="#00897B" />
    <circle cx="62" cy="48" r="8" fill="#F2F7F9" />
  </g>

  <text x="190" y="290" font-family="DejaVu Serif, serif" font-size="64" font-weight="700" fill="#F2F7F9">AIC Consultores</text>
  <rect x="92" y="322" width="120" height="4" fill="#E4AB37" />
  <text x="90" y="380" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#CBD8E0">Contabilidad · SG-SST · Riesgo psicosocial</text>
  <text x="90" y="425" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#8FA3B3">Popayán, Cauca — Colombia</text>
</svg>
